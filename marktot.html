<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK CALCULTOR</title>
</head>
<style>
    .continer {
    text-align: center;
    width: 400px;
    margin: 50px auto;
    background: #fff7e6;     /* box background color */
    padding: 30px;            /* space inside box */
    border-radius: 15px;      /* round corners */
    box-shadow: 0 0 15px rgba(0,0,0,0.2); /* box shadow */
}

    input{
        padding: 10px;
        margin-bottom: 15PX;
        width: 250px;
        display: block;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid;
        background-color:white;



    }
    body {
    display: flex;
    justify-content: center;   /* horizontal center */
    align-items: center;       /* vertical center */
    height: 100vh;             /* full screen height */
    margin: 0;             
}
h1{
    margin-left: -50px;
}
label{
    color: red;
    margin-left: -310px;
    font-weight: bold;
    font-family: 'Times New Roman', Times, serif;
}

    button{
        padding: 10px;
        background: red;
        font-weight: bold;
        border-radius: 10px;
        margin-left: -50px;
    }
    form{
        text-align: center;
        
    }
</style>
<body>
    <div class="continer">
    <h1>Student Marks Total</h1>
    <form>
    <label>TAMIL:</label>
    <input type="number" id="tam" placeholder="Enter the Tamil Mark" required><br>
    <label>ENGLISH:</label>
    <input type="number" id="eng" placeholder="Enter the English Mark" required><br>
    <label>MATHS:</label>
    <input type="number" id="math" placeholder="Enter the Maths Mark" required><br>
    </form>

    <button type="button" onclick="cal()">CALCULT MARK</button>

    <h2 id="result"></h2>
    </div>
    <script>
        function cal(){
            let tam= Number(document.getElementById("tam").value);
            let eng=Number(document.getElementById("eng").value);
            let math=Number(document.getElementById("math").value);

            if(document.getElementById("tam").value ==="" ||
            document.getElementById("eng").value ===""||
            document.getElementById("math").value ==="" ){
                alert("Please fill the Every Mark");
                return;
            }
            let total= tam + eng + math;
            let status =" "
                if(tam<35 || eng<35|| math<35){
                    status="❌FAILL";
                }else{
                    status="✅PASS";
                }
            

            document.getElementById("result").innerText="TotalMark"+total+ "|" +status;
        }
        
    </script>
    
</body>
</html>
