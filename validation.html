<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }
        .form-box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid gray;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .error {
            color: red;
            height: 18px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h3>Validated Form</h3>

    <label>Name:</label>
    <input type="text" id="name">
    <p id="nameError" class="error"></p>

    <label>Email:</label>
    <input type="text" id="email">
    <p id="emailError" class="error"></p>

    <label>Password:</label>
    <input type="password" id="password">
    <p id="passError" class="error"></p>

    <button onclick="submitForm()">Submit</button>

    <h3 id="successMsg" style="color:green;"></h3>
</div>

<script>
   function submitForm(){
    let name=document.getElementById("name").value.trim();
    let email=document.getElementById("email").value.trim();
    let pass=document.getElementById("password").value.trim();


    let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    let isvalid=true;

    if(name ==""){
        document.getElementById("nameError").innerText="Name is Required"
        isvalid=false;
    }else{
        document.getElementById("nameError").innerText="";
    }

    if(email==""){
        document.getElementById("emailError").innerText="Email is required";
        isvalid=false;
    }else if(!emailRegex.test(email)){
        document.getElementById("emailError").innerText="Invalid Email";
        isvalid=false;
    }else{
        document.getElementById("emailError").innerText="";
    }
    if(pass==""){
        document.getElementById("passError").innerText="Password is Required";
        isvalid=false;

    }
    else if(pass.length<6){
        document.getElementById("passError").innerText="password must have six letters"
        isvalid=false;
    }else{
        document.getElementById("passError").innerText="";
    }
    if(isvalid){
        document.getElementById("successMsg").innerText="Form Completed Sucessfully";
    } else{
        document.getElementById("successMsg").innerText="";
    }
   }

   </script>
</body>
</html>
